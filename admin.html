<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Achadinhos</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">🛍️ Achadinhos</a><a class="navlink" href="index.html">Ver loja</a></div></header><main class="wrap admin"><section id="login" class="panel login"><h1>🔐 Painel privado</h1><p class="muted">Digite sua chave de administrador.</p><input id="loginKey" type="password" placeholder="Chave de administrador"><button onclick="entrar()">Entrar</button></section><section id="painel" class="hidden"><div class="nav"><h1>Painel de administração</h1><button onclick="sair()">Sair</button></div><div class="warning">🔒 Área protegida.</div><section class="panel"><h2>Nova categoria</h2><form id="categoriaForm"><input id="categoriaNome" placeholder="Ex.: Casa / Apartamento" required><button>Criar categoria</button></form><div id="listaCategorias"></div></section><section class="panel"><h2 id="tituloForm">Novo produto</h2><form id="produtoForm"><input id="nome" placeholder="Nome do produto" required><select id="categoria"><option value="">Sem categoria</option></select><input id="preco" placeholder="Preço. Ex.: R$ 59,90"><input id="imagem" placeholder="URL da imagem principal" required><input id="imagens" placeholder="Outras URLs, separadas por vírgula"><textarea id="descricao" placeholder="Descrição"></textarea><textarea id="especificacoes" placeholder="Especificações"></textarea><input id="linkAmazon" placeholder="Seu link de afiliado da Amazon" required><input id="etiqueta" placeholder="Etiqueta. Ex.: Oferta"><button id="btnSalvar">Adicionar produto</button><button type="button" id="btnCancelar" class="hidden" onclick="cancelar()">Cancelar edição</button></form><p id="resultado"></p></section><section class="panel"><h2>Produtos cadastrados</h2><div id="listaProdutos"></div></section></section></main><script src="admin.js"></script></body></html>
